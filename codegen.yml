schema: schema/wave.graphql
generates:
  nodes/Wave/generated/schema.ts:
    plugins:
      - typescript
    config:
      enumsAsTypes: true
      useTypeImports: true
      skipTypename: true
      namingConvention: keep
      scalars:
        Date: string
        DateTime: string
        Decimal: string
        URL: string
        HexColorCode: string
        JSON: unknown
        Upload: unknown
