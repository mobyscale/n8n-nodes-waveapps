# Runs the integration tests against the Wave test account when a pull request is merged
# into main. The Publish workflow runs them again before it publishes.
#
# Secrets: WAVE_ACCESS_TOKEN (full access token of the test account) and WAVE_BUSINESS_ID.
# Use a test-only Wave account: the tests create, change and archive records.
# Pull requests do not run this workflow, so a pull request cannot read the secrets.

name: Integration

on:
  push:
    branches:
      - main

concurrency:
  # The tests share one Wave account, so two runs at the same time can collide. The Publish
  # workflow uses the same group.
  group: wave-test-account
  cancel-in-progress: false

permissions:
  contents: read

env:
  WAVE_ACCESS_TOKEN: ${{ secrets.WAVE_ACCESS_TOKEN }}
  WAVE_BUSINESS_ID: ${{ secrets.WAVE_BUSINESS_ID }}

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # Without the token the tests skip and the run looks green.
      - name: Check the secrets
        run: |
          if [ -z "$WAVE_ACCESS_TOKEN" ] || [ -z "$WAVE_BUSINESS_ID" ]; then
            echo "::error::Add the WAVE_ACCESS_TOKEN and WAVE_BUSINESS_ID secrets to the repository."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the integration tests
        run: npm run test:integration
