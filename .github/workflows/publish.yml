# Publishes the package to npm with a provenance statement when a GitHub release is published.
# The release tag must be the version in package.json, for example 1.0.0 (no "v").
# The release steps are in docs/development.md, section "Release".
#
# n8n accepts verified community nodes only when GitHub Actions publishes them with npm
# provenance (required since 2026-05-01). Do not publish from a local machine.
#
# npm authentication: the NPM_TOKEN secret, or Trusted Publishing on npmjs.com with
#   Organization or user: mobyscale
#   Repository:           n8n-nodes-waveapps
#   Workflow filename:    publish.yml
# With Trusted Publishing, remove the NPM_TOKEN secret.

name: Publish

on:
  release:
    types:
      - published

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest

    permissions:
      # Lets the job get an OIDC token for Trusted Publishing and the provenance statement.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag is the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the package version $version."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # In GitHub Actions, `n8n-node release` runs lint and build, then `npm publish` with
      # NPM_CONFIG_PROVENANCE=true.
      - name: Publish
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
