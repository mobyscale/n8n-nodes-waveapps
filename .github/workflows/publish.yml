# Publishes the package to npm with a provenance statement when a version tag is pushed.
#
# n8n accepts verified community nodes only when GitHub Actions publishes them with npm
# provenance (required since 2026-05-01). Do not publish from a local machine.
# The release steps are in docs/development.md, section "Release".
#
# One-time setup on npmjs.com (Trusted Publishing, no token in this repository):
#   Package settings > Trusted Publishers > GitHub Actions
#     Organization or user: mobyscale
#     Repository:           n8n-nodes-waveapps
#     Workflow filename:    publish.yml
#     Environment:          (empty)
# Until Trusted Publishing is set up, the NPM_TOKEN secret (a granular npm token with publish
# access) is used. Provenance works with both methods.
#
# The Tests job runs the unit and integration tests first. It needs the WAVE_ACCESS_TOKEN and
# WAVE_BUSINESS_ID secrets.
#
# npm rejects provenance from a private repository, so the repository must be public.

name: Publish

on:
  push:
    tags:
      # release-it makes tags without a "v" prefix, for example 0.1.0 or 1.0.0-rc.1.
      - '*.*.*'

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    # The integration tests share one Wave account with the Integration workflow.
    concurrency:
      group: wave-test-account
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      WAVE_ACCESS_TOKEN: ${{ secrets.WAVE_ACCESS_TOKEN }}
      WAVE_BUSINESS_ID: ${{ secrets.WAVE_BUSINESS_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Check that the tag is the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the package version $version."
            exit 1
          fi

      # Without the token the integration tests skip and the run looks green.
      - name: Check the secrets
        run: |
          if [ -z "$WAVE_ACCESS_TOKEN" ] || [ -z "$WAVE_BUSINESS_ID" ]; then
            echo "::error::Add the WAVE_ACCESS_TOKEN and WAVE_BUSINESS_ID secrets to the repository."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the unit tests
        run: npm test

      - name: Run the integration tests
        run: npm run test:integration

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest

    permissions:
      # Lets the job get an OIDC token for Trusted Publishing and the provenance statement.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # In GitHub Actions, `n8n-node release` runs lint and build, then `npm publish` with
      # NPM_CONFIG_PROVENANCE=true.
      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
